name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Throwaway values: tests run on in-memory PGlite, build needs no secrets.
      DATABASE_URL: memory://
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      ANONYMOUS_PEPPER: ci-anonymous-pepper-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup's bootstrap crashes on this repo's pnpm config, so install pnpm directly.
      - run: npm install -g pnpm@11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm test
      - run: pnpm build

  # The same test suite against real PostgreSQL (what production runs), not just the embedded PGlite.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: namps
          POSTGRES_PASSWORD: namps
          POSTGRES_DB: namps_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U namps -d namps_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://namps:namps@localhost:5432/namps_test
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      ANONYMOUS_PEPPER: ci-anonymous-pepper-0123456789
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm exec vitest run --no-file-parallelism
